*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter Tight",system-ui,sans-serif;font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
.pg{width:1440px;height:1200px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;display:grid;grid-template-columns:200px 1fr;}
.mono{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.serif{font-family:Fraunces,serif;font-variation-settings:"opsz" 144;font-weight:300;letter-spacing:-.02em}
/* left rail: vertical marginalia */
.rail{border-right:1px solid var(--rule);padding:34px 0 34px 30px;display:flex;flex-direction:column;justify-content:space-between}
.brand{font-family:Fraunces,serif;font-weight:300;font-size:24px;letter-spacing:-.01em}

.toc{display:flex;flex-direction:column;gap:22px;margin-top:48px}

.toc .n{display:flex;gap:10px;align-items:baseline}
.toc .n .num{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute);width:22px}
.toc .n .t{font-size:13.5px;color:var(--ink2)}
.toc .n.on .t{color:var(--ink);font-weight:500}
.toc .n.on::before{content:"";position:absolute;left:0;width:3px;height:16px;background:var(--neon);border-radius:0 2px 2px 0;transform:translateY(2px)}

.aside .row span:last-child{font-family:"JetBrains Mono",monospace;font-size:12px}
.vert{position:absolute;right:22px;top:50%;transform:rotate(90deg) translateX(-50%);transform-origin:right top;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.label{position:absolute;left:30px;bottom:30px}

/* ── INSTRUMENTS: vintage radio / FM tuner / knob — limited neumorph lives ONLY here ── */
.bezel{border-radius:22px;padding:14px;background:var(--bezel);box-shadow:-6px -6px 14px var(--hi),8px 10px 22px var(--lo),inset 0 1px 0 rgba(255,255,255,.55);position:relative}
