<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Amuletta">
  <!-- Yay/halka markası — iki hilal + üçgen; negatif alan A. -->
  <rect width="512" height="512" rx="112" fill="#eaecf3"/>
  <ellipse cx="256" cy="412" rx="132" ry="22" fill="#343949" opacity="0.07"/>
  <g fill="#6b5bd6">
    <!-- Sol hilal (içe bakıyor) -->
    <path fill-rule="evenodd" d="
      M210 98
      C118 130 72 210 72 286
      C72 378 148 448 240 448
      C198 448 148 400 148 286
      C148 198 178 130 210 98
      Z"/>
    <!-- Sağ hilal -->
    <path fill-rule="evenodd" d="
      M302 98
      C394 130 440 210 440 286
      C440 378 364 448 272 448
      C314 448 364 400 364 286
      C364 198 334 130 302 98
      Z"/>
    <!-- Üst birleşim köprüsü (hafif örtüşme) -->
    <ellipse cx="256" cy="118" rx="28" ry="22" opacity="0.85"/>
    <!-- A çapraz çubuğu / mücevher üçgeni -->
    <path d="M256 292 L214 358 L298 358 Z"/>
  </g>
  <!-- Doğal speküler (mat, neon değil) -->
  <ellipse cx="168" cy="180" rx="36" ry="18" fill="#ffffff" opacity="0.14" transform="rotate(-24 168 180)"/>
</svg>
