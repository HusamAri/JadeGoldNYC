<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Amuletta">
  <!-- Amuletta app icon  light. Soft lavender ground + indigo glass orb + serif A.
       Production mark; CSS-adaptable twin lives in icon-dark.svg. -->
  <defs>
    <radialGradient id="am-ground" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#f6f5fa"/>
      <stop offset="55%" stop-color="#eaecf3"/>
      <stop offset="100%" stop-color="#e0ddeb"/>
    </radialGradient>
    <radialGradient id="am-orb" cx="32%" cy="28%" r="90%">
      <stop offset="0%" stop-color="#cfc8ff"/>
      <stop offset="48%" stop-color="#8a7ae6"/>
      <stop offset="68%" stop-color="#6b5bd6"/>
      <stop offset="100%" stop-color="#4030a0"/>
    </radialGradient>
    <radialGradient id="am-spec" cx="35%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="am-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#am-ground)"/>
  <!-- soft ambient glow -->
  <circle cx="256" cy="268" r="168" fill="#6b5bd6" opacity="0.18"/>
  <g filter="url(#am-glow)">
    <circle cx="256" cy="256" r="168" fill="url(#am-orb)"/>
    <circle cx="256" cy="256" r="168" fill="url(#am-spec)"/>
  </g>
  <!-- serif A monogram  stroke jewelry language -->
  <g transform="translate(256 262) scale(7.2) translate(-24 -23.7)"
     stroke="#ffffff" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 10.8 14.6 36.6" stroke-width="2"/>
    <path d="M24 10.8 33.4 36.6" stroke-width="3.6"/>
    <path d="M16.9 28.4h14.2" stroke-width="2"/>
    <path d="M11.4 36.6h6.4" stroke-width="2"/>
    <path d="M30.2 36.6h6.4" stroke-width="2"/>
  </g>
</svg>
