<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="EON monogram">
  <!-- Architectural E mark in a quiet square frame · charcoal on transparent -->
  <rect x="8" y="8" width="104" height="104" stroke="#1C1C1C" stroke-width="1.25"/>
  <g fill="#1C1C1C">
    <!-- Three-bar architectural E (elevation) -->
    <rect x="34" y="32" width="52" height="7"/>
    <rect x="34" y="56.5" width="40" height="7"/>
    <rect x="34" y="81" width="52" height="7"/>
    <rect x="34" y="32" width="7" height="56"/>
  </g>
</svg>
